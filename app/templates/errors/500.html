{% extends "base.html" %}

{% block title %}500 - Internal Server Error — Personal Finance Advisor{% endblock %}

{% block content %}
<div class="row justify-content-center py-5 text-center">
    <div class="col-md-6">
        <div class="p-5 bg-white rounded-4 shadow-sm border">
            <div class="display-1 fw-bold text-danger mb-3">500</div>
            <h3 class="fw-bold text-dark mb-2">Something Went Wrong</h3>
            <p class="text-muted mb-4">
                An internal server issue occurred while processing your request. Your financial data is safely stored.
            </p>
            <div class="d-flex justify-content-center gap-2">
                <a href="{{ url_for('dashboard.dashboard') if current_user.is_authenticated else url_for('auth.index') }}"
                   class="btn btn-outline-primary px-4 fw-bold">
                    <i class="bi bi-arrow-left me-1"></i> Back to Dashboard
                </a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
